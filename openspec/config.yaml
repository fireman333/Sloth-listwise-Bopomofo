# OpenSpec config — generated by /spec init (2026-10-07). Keep in sync with openspec/project.md by hand.
schema: spec-driven

context: |
  Purpose: macOS Zhuyin (Bopomofo) input method forked from McBopomofo. Per keystroke, a local small model R
  (fine-tuned SlothLM-E, scores added inside the McBopomofo walk, ~1.4 ms) picks characters. Optional "precise mode"
  runs in the background: calibrated gate decides when to call Qwen3-0.6B and fuses its scores with R (82.5% on the
  general benchmark). Manual user picks are remembered and always win. Goal: public release; all data and models must
  be redistributable.
  Users: Taiwan Traditional-Chinese Zhuyin typists (standard layout); first user is the developer (medical background).
  Stack & Constraints: Swift + Objective-C++ App (InputMethodKit); C++ engine (Source/Engine/gramambular2, Source/Engine/Rescorer);
  onnxruntime 1.30 int8 CPU (R/D/ELECTRA); llama.cpp + Metal (Qwen3 q8_0); Apple Silicon, macOS 26+, Xcode 27.
  Per-key latency p95 < 10 ms. Only the composing buffer may change; committed text is never modified.
  Fallback chain: precise mode -> R-walk -> stock walk (no D layer); model failure must never block typing.
  Reading policy: 癌 defaults to ㄞˊ (ㄧㄢˊ only if user opts in); 一/不 accept base tone and sandhi.
  Training data must not include c4, Wikipedia, CC BY-ND, NC, or Apple Foundation Models output.
  Out of scope: cloud inference (typing never leaves the device); editing committed text; reading other apps' text as context;
  non-Apple-Silicon or macOS < 26.
  Research, benchmarks and experiments live in ../PLAN.md and ../bench/ — not in specs.
  Spec conventions: SHALL for normative requirements; WHEN/THEN BDD scenarios; kebab-case capability names.

rules:
  proposal:
    - "Before writing any non-trivial decision (architecture, library choice, naming convention, scope cut) into the proposal, use AskUserQuestion in Traditional Chinese — do not assume."
    - "Do not implement code for this change before the proposal exists. propose → apply → verify → archive is mandatory; never skip propose."
  specs:
    - "Every requirement touching keystroke handling must state the latency budget and the fallback behavior when a model is unavailable or slow."
    - "Never allow a requirement that modifies already-committed text or sends typed text off the device."
  design:
    - "For any non-trivial technical choice, surface the alternatives and use AskUserQuestion before committing it to the design."
    - "Engine changes must keep the default (alpha=0 / model absent) behavior identical to upstream McBopomofo."
  tasks:
    - "Never run `git commit` automatically — commits go through the auto-git skill or explicit user confirmation."
    - "Every engine task needs gtest coverage; every App task needs an xcodebuild success check."
    - "Do not archive this change until /opsx:verify reports green on completeness / correctness / coherence."
